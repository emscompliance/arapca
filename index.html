<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2196F3">
<meta name="description" content="Mısır Arapçası (Amiyye) günlük kelime ve cümle rehberi — okunuşuyla, çevrimdışı çalışır.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arapça Öğreniyorum">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-apple-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Arapça Öğreniyorum — أتعلم العربية</title>
<style>
  :root{
    /* ═══ YENİ TEMA (eCoursify LMS esinli) ═══ Açık zemin, canlı mavi ana renk (#2196F3 — bu
       şablonun kendi meta etiketinden alındı), turuncu ikincil vurgu, temiz beyaz kartlar. /
       ═══ NEW THEME (eCoursify LMS-inspired) ═══ Light background, vivid blue primary
       (#2196F3 — taken directly from this template's own meta tag), orange secondary accent,
       clean white cards. */
    --bg0:#EFF4FA; --bg1:#FFFFFF;
    --glass:#FFFFFF; --glass-hi:#F5F9FF; --glass-border:#E1E9F2;
    --ink:#16232E; --ink-dim:#5C7186; --ink-faint:#9AACBC;
    --gold:#2196F3; --gold-soft:#64B5F6; --gold-text:#1565C0; --gold-glow:rgba(33,150,243,0.24);
    --red:#FF7043; --red-soft:#FFAB85; --red-glow:rgba(255,112,67,0.28);
    --brand-red:#E5393B;
    --teal:#00BFA5; --teal-soft:#5CE0CB; --teal-glow:rgba(0,191,165,0.24);
    --radius-lg:26px; --radius-md:18px; --radius-sm:12px;
    --nav-h:70px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --shadow-card:0 8px 28px rgba(22,35,46,0.08);
    --shadow-pop:0 16px 44px rgba(22,35,46,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    background:var(--bg0); color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
    padding-top:var(--sat); position:relative; min-height:100%;
  }
  /* ── Sabit, yumuşak mavi/turuncu ışık lekeleri — açık zeminde ince bir derinlik hissi / Fixed,
       soft blue/orange light blobs — a subtle sense of depth on the light background ── */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 620px 460px at 88% -6%, rgba(33,150,243,0.10), transparent 60%),
      radial-gradient(ellipse 560px 480px at -10% 18%, rgba(255,112,67,0.09), transparent 60%),
      radial-gradient(ellipse 700px 560px at 50% 108%, rgba(0,191,165,0.08), transparent 60%);
    animation:driftBlobs 26s ease-in-out infinite alternate;
  }
  @keyframes driftBlobs{ 0%{ background-position:0 0,0 0,0 0;} 100%{ background-position:-30px 20px, 25px -15px, 15px 25px;} }
  @media (prefers-reduced-motion:reduce){ body::before{animation:none;} }

  h1,h2,h3{font-weight:800; letter-spacing:-.01em;}
  .ar{ font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Damascus",Tahoma,sans-serif; direction:rtl; unicode-bidi:isolate; }
  .kufi{ font-family:"Reem Kufi","Amiri","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif; direction:rtl; unicode-bidi:isolate; }
  .lat-pill{
    direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:5px;
    font-weight:700; font-size:13.5px; color:#0B0B0B; background:linear-gradient(135deg,var(--teal-soft),var(--teal));
    padding:5px 13px; border-radius:99px; letter-spacing:.01em;
  }
  button{font-family:inherit; cursor:pointer; color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold); color:#FFFFFF;}
  input{color:var(--ink); user-select:text;}

  /* ═══════════ GLASS bileşenleri / GLASS primitives ═══════════ */
  .glass{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg);
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:var(--shadow-card);
  }

  /* ═══════════ APP SHELL ═══════════ */
  #app{max-width:1180px; margin:0 auto; min-height:100%; display:flex; position:relative; z-index:1;}
  #sidebar{display:none;}
  #main-col{flex:1; min-width:0; padding-bottom:calc(var(--nav-h) + var(--sab) + 28px);}

  .topbar{padding:calc(16px + var(--sat)) 16px 8px;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px; background:none; border:none; padding:2px; border-radius:14px;}
  .brand:active{transform:scale(.96);}
  /* ── Logo işareti: verilen logodaki gibi kırmızı "ع" harfi — favicon ile birebir aynı, tıklanınca
       anasayfaya döner / Logo mark: red "ع" letter as in the provided logo — matches the favicon
       exactly, clicking it returns to the home screen ── */
  .logo-mark{
    font-family:"Amiri","Noto Naskh Arabic",serif; color:var(--brand-red); font-weight:700; line-height:0.8;
    font-size:30px; flex-shrink:0; direction:rtl; text-shadow:0 4px 14px rgba(229,57,59,0.28);
  }
  .brand-text{line-height:1.2; text-align:left;}
  .brand-text .kufi{font-size:15px; font-weight:700; color:var(--ink);}
  .brand-text .sub{font-size:9px; letter-spacing:.1em; color:var(--gold); text-transform:uppercase; font-weight:800;}
  .flag-pill{
    display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px; font-size:12px; font-weight:700; color:var(--ink-dim);
  }
  .flag-pill .fl{font-size:15px;}
  /* ── Gerçek SVG bayrak ikonları — Windows'ta bayrak emojileri "TR"/"EG" gibi düz metin olarak
       göründüğü için (sistem emoji fontunun sınırlaması), bayraklar artık her platformda AYNI
       görünen vektör grafikler olarak çiziliyor. / Real SVG flag icons — since flag emoji render as
       plain "TR"/"EG" text on Windows (a system emoji-font limitation), flags are now drawn as
       vector graphics that look IDENTICAL on every platform. ── */
  .flag-ico{width:22px; height:auto; border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,0.4); vertical-align:middle; flex-shrink:0; display:inline-block;}
  .flag-ico.sm{width:17px;}
  .flag-ico.lg{width:36px;}
  .streak-pill{display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:99px; font-size:12.5px; font-weight:800; color:var(--gold-text);}
  .offline-pill{display:none; align-items:center; gap:5px; background:var(--red); border-radius:99px; padding:5px 10px; font-size:10px; font-weight:800; color:#fff; margin-inline-end:6px;}
  .offline-pill.show{display:flex;}

  .section{padding:14px 16px 4px; position:relative; z-index:1;}
  .section-title{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; display:flex; align-items:center; gap:8px;}
  .section-title .rule{flex:1; height:1px; background:var(--glass-border);}

  /* ── Köprü rozeti: 🇹🇷 → 🇪🇬 — imza unsuru / Bridge badge: 🇹🇷 → 🇪🇬 — signature element ── */
  .bridge-strip{display:flex; align-items:center; justify-content:center; gap:14px; padding:14px 10px 18px;}
  .bridge-flag{font-size:30px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
  .bridge-route{flex:0 0 auto; display:flex; align-items:center; gap:4px; width:120px; position:relative;}
  .bridge-line{flex:1; height:2px; background:repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 11px);}
  .bridge-plane{font-size:15px; transform:rotate(90deg); flex-shrink:0;}
  .bridge-caption{text-align:center; font-size:11px; color:var(--ink-faint); font-weight:700; margin-top:-8px; margin-bottom:6px; letter-spacing:.02em;}

  /* ── Çevirmen kartı / Translator card ── */
  .translator-card{padding:20px 18px 18px; position:relative; overflow:hidden;}
  .translator-title{font-size:16px; font-weight:800; margin-bottom:3px; color:var(--ink);}
  .translator-sub{color:var(--ink-dim); font-size:12px; margin-bottom:14px;}
  .search-wrap{position:relative;}
  .search-input-row{position:relative;}
  .search-wrap input{
    width:100%; border:1.5px solid var(--glass-border); border-radius:16px; padding:16px 90px 16px 16px;
    font-size:16px; background:#F5F9FD; color:var(--ink); font-weight:600;
  }
  .search-wrap input::placeholder{color:var(--ink-faint); font-weight:500;}
  .search-wrap input:focus{outline:none; border-color:var(--gold);}
  .search-clear{position:absolute; right:46px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; display:none; align-items:center; justify-content:center; font-size:13px; color:var(--ink-dim);}
  .search-clear.show{display:flex;}
  .mic-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--teal-soft),var(--teal)); border:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#0B0B0B;}
  .mic-btn.listening{background:var(--red); color:#fff; animation:mic-pulse 1.1s ease-in-out infinite;}
  @keyframes mic-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,112,67,0.5);} 50%{ box-shadow:0 0 0 9px rgba(255,112,67,0);} }
  .search-results{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .search-hit{background:#FAFCFE; border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;}
  .search-hit.top-hit{background:rgba(255,75,75,0.10); border-color:var(--red);}
  .search-hit .ar{font-size:20px; color:var(--gold-text); flex-shrink:0; min-width:64px;}
  .search-hit .meta{min-width:0; flex:1; display:flex; flex-direction:column; gap:5px; align-items:flex-start;}
  .search-hit .meta .tr{font-size:13.5px; font-weight:700; color:var(--ink);}
  .search-hit .hit-play{width:34px; height:34px; border-radius:50%; background:rgba(33,150,243,0.10); border:none; color:var(--gold-text); font-size:14px; flex-shrink:0;}
  .search-empty{padding:16px; text-align:center; color:var(--ink-faint); font-size:13px;}
  .search-hint-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px;}
  .hint-chip{background:#F5F9FD; border:1px solid var(--glass-border); color:var(--ink-dim); border-radius:99px; padding:6px 12px; font-size:11.5px; font-weight:700;}

  /* ── Günün Kelimesi (istiflenmiş) / Word of the Day (stacked) ── */
  .hero-card{padding:28px 22px; position:relative; overflow:hidden; text-align:center;}
  .hero-card .glow-orb{position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, var(--gold-glow), transparent 70%); top:-70px; right:-60px; pointer-events:none;}
  .hero-eyebrow{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; position:relative;}
  .hero-ar{font-size:44px; color:var(--ink); line-height:1.3; margin-bottom:14px; position:relative; background:linear-gradient(135deg,var(--ink),var(--gold)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .hero-lat-row{margin-bottom:14px; position:relative;}
  .hero-tr{font-size:20px; font-weight:800; margin-bottom:3px; position:relative; color:var(--ink);}
  .hero-en{font-size:12.5px; color:var(--ink-faint); margin-bottom:20px; position:relative;}
  .hero-actions{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; position:relative;}

  .btn{border:none; border-radius:99px; padding:13px 20px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px; transition:transform .12s; min-height:46px;}
  .btn:active{transform:scale(.95);}
  .btn-primary{background:linear-gradient(135deg,var(--gold-soft),var(--gold)); color:#FFFFFF; box-shadow:0 8px 22px var(--gold-glow);}
  .btn-teal{background:linear-gradient(135deg,var(--teal-soft),var(--teal)); color:#0B0B0B; box-shadow:0 8px 22px var(--teal-glow);}
  .btn-red{background:linear-gradient(135deg,var(--red-soft),var(--red)); color:#fff; box-shadow:0 8px 22px var(--red-glow);}
  .btn-glass{background:#F5F9FD; border:1.5px solid var(--glass-border); color:var(--ink);}
  .btn-lg{padding:16px 26px; font-size:15px;}
  .btn-block{width:100%; justify-content:center;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .stat-card{padding:15px 8px; text-align:center;}
  .stat-card .num{font-size:23px; font-weight:800; color:var(--ink); font-family:'Manrope',sans-serif;}
  .stat-card .lbl{font-size:9.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-top:3px;}

  /* ── Kategori kartları: canlı degrade fayanslar / Category tiles: vivid gradient tiles ── */
  .cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:2px;}
  .cat-card{
    background:linear-gradient(150deg, var(--c1), var(--c2)); border-radius:var(--radius-md);
    padding:16px 14px; text-align:left; position:relative; overflow:hidden; border:none;
    box-shadow:0 10px 24px rgba(0,0,0,0.28); min-height:128px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cat-card::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 90% -10%, rgba(255,255,255,0.28), transparent 55%);}
  .cat-card .mark{font-size:21px; color:#fff; opacity:.92; position:relative;}
  .cat-card .name{font-weight:800; font-size:14.5px; color:#fff; margin-top:8px; position:relative;}
  .cat-card .en{font-size:10.5px; color:rgba(255,255,255,0.78); margin-bottom:9px; position:relative;}
  .cat-card .prog-track{background:rgba(0,0,0,0.25); border-radius:99px; height:6px; overflow:hidden; position:relative;}
  .cat-card .prog-fill{height:100%; background:#fff; border-radius:99px;}
  .cat-card .prog-txt{font-size:10px; color:rgba(255,255,255,0.85); margin-top:5px; font-weight:700; position:relative;}

  .guide-link{display:flex; align-items:center; gap:10px; padding:14px 16px; font-size:12.5px; font-weight:700; color:var(--gold-text); width:100%; text-align:left; min-height:46px; border:1px solid var(--glass-border); border-radius:var(--radius-md); background:rgba(33,150,243,0.08);}
  .guide-link .ic{font-size:18px;}

  /* ── Kelime kartları: dikey istif (Arapça / okunuş / anlam alt alta) / Word cards: vertical stack ── */
  .word-list{display:flex; flex-direction:column; gap:11px; padding:0 16px 20px; position:relative; z-index:1;}
  .word-card{padding:18px; position:relative; overflow:hidden;}
  .word-card.learned{border-color:var(--teal);}
  .word-card.learned::before{content:'✓ ÖĞRENİLDİ'; position:absolute; top:12px; right:14px; font-size:9px; font-weight:800; letter-spacing:.05em; color:#00806E;}
  .word-stack{display:flex; flex-direction:column; align-items:flex-start; gap:9px;}
  .word-stack .ar{font-size:25px; color:var(--ink);}
  .word-stack .tr{font-size:14.5px; font-weight:800; color:var(--ink); margin-top:2px;}
  .word-stack .en{font-size:11.5px; color:var(--ink-faint);}
  .word-actions-row{display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--glass-border);}
  .icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--glass-border); background:#F5F9FD; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-dim);}
  .icon-btn.on{background:linear-gradient(135deg,var(--gold-soft),var(--gold)); border-color:transparent; color:#FFFFFF;}
  .icon-btn.learned-on{background:linear-gradient(135deg,var(--teal-soft),var(--teal)); border-color:transparent; color:#0B0B0B;}
  .icon-btn.grow{flex:1; border-radius:14px; gap:6px; font-size:12.5px; font-weight:700;}

  /* ── Pratik / flashcard (kaydırmalı) ── */
  .practice-wrap{padding:16px; display:flex; flex-direction:column; align-items:center; position:relative; z-index:1;}
  .dots{display:flex; gap:5px; margin-bottom:18px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--glass-border);}
  .dot.done{background:var(--teal);}
  .dot.now{background:var(--gold); width:18px; border-radius:99px;}
  .flash-stage{width:100%; max-width:400px; position:relative; min-height:300px;}
  .flash{
    width:100%; min-height:300px; border-radius:var(--radius-lg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:32px 24px; position:relative;
    touch-action:pan-y; user-select:none; will-change:transform; overflow:hidden;
  }
  .flash::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 20% 0%, rgba(33,150,243,0.14), transparent 55%);}
  .flash-face-a .ar{font-size:46px; color:var(--ink); margin-bottom:14px; position:relative;}
  .flash-hint{font-size:11.5px; color:var(--ink-faint); margin-top:18px; font-weight:600; position:relative;}
  .flash-face-b{display:none;}
  .flash.flipped .flash-face-a{display:none;}
  .flash.flipped .flash-face-b{display:flex; flex-direction:column; align-items:center; gap:11px; position:relative;}
  .flash-face-b .tr{font-size:22px; font-weight:800; color:var(--ink);}
  .flash-face-b .en{font-size:12.5px; color:var(--ink-faint); margin-bottom:6px;}
  .flash-cat-tag{position:absolute; top:16px; left:16px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--gold-text); background:rgba(33,150,243,0.14); padding:5px 10px; border-radius:99px; z-index:2;}
  .flash-swipe-badge{position:absolute; top:18px; padding:7px 15px; border-radius:99px; font-size:12px; font-weight:900; text-transform:uppercase; opacity:0; transform:scale(.8); pointer-events:none; letter-spacing:.03em; z-index:2;}
  .flash-swipe-badge.left{right:18px; background:var(--red); color:#fff;}
  .flash-swipe-badge.right{left:18px; background:var(--teal); color:#0B0B0B;}
  .practice-actions{display:flex; gap:10px; margin-top:22px; width:100%; max-width:400px;}
  .practice-actions .btn{flex:1;}
  .swipe-tip{font-size:11px; color:var(--ink-faint); margin-top:12px; font-weight:600;}
  .practice-summary{text-align:center; padding:38px 22px; position:relative; z-index:1;}
  .practice-summary .big{font-size:54px; margin-bottom:16px;}

  /* ── Sınav / Quiz ── */
  .quiz-wrap{padding:16px; max-width:460px; margin:0 auto; position:relative; z-index:1;}
  .quiz-q{padding:26px 22px; text-align:center; margin-bottom:16px;}
  .quiz-q .ar{font-size:38px; color:var(--ink); margin-bottom:12px;}
  .quiz-opts{display:flex; flex-direction:column; gap:10px;}
  .quiz-opt{background:#FAFCFE; border:1.5px solid var(--glass-border); border-radius:var(--radius-md); padding:16px 18px; text-align:left; font-size:14.5px; font-weight:700; color:var(--ink); min-height:46px;}
  .quiz-opt.correct{background:rgba(0,191,165,0.14); border-color:var(--teal); color:#00806E;}
  .quiz-opt.wrong{background:rgba(255,112,67,0.14); border-color:var(--red); color:#C4441C;}
  .quiz-progress{font-size:12px; font-weight:700; color:var(--ink-faint); text-align:center; margin-bottom:12px;}
  .quiz-result{text-align:center; padding:22px;}
  .quiz-result .stars{font-size:34px; letter-spacing:8px; margin:14px 0; color:var(--gold);}
  .quiz-result .score{font-size:46px; font-weight:800; background:linear-gradient(135deg,var(--ink),var(--gold)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}

  .empty-state{padding:48px 22px; text-align:center; color:var(--ink-faint); position:relative; z-index:1;}
  .empty-state .glyph{font-size:40px; margin-bottom:12px;}

  .back-row{padding:16px 16px 0; display:flex; align-items:center; gap:10px; position:relative; z-index:1;}
  .back-btn{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink);}
  .cat-header{padding:16px 16px 4px; position:relative; z-index:1;}
  .cat-header .kufi{font-size:23px; color:var(--ink);}
  .cat-header .en{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}

  /* ── Okuma Rehberi modal ── */

function catOf(id){ return CATS.find(c => c.id === id); }

/* ══════════════════════════ DURUM / STATE (localStorage) ══════════════════════════ */
const STORE_KEY = 'masrawy_v2';
function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem('masrawy_v1');
    if (old) return JSON.parse(old);
  } catch(e) {}
  return { learned:{}, favorites:{}, lastVisit:null, streak:0, bestQuiz:0, recentSearches:[] };
}
let STATE = loadState();
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch(e) {} }

function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if (STATE.lastVisit === today) return;
  if (STATE.lastVisit) {
    const diffDays = Math.round((new Date(today) - new Date(STATE.lastVisit)) / 86400000);
    STATE.streak = (diffDays === 1) ? (STATE.streak || 0) + 1 : 1;
  } else { STATE.streak = 1; }
  STATE.lastVisit = today;
  saveState();
}
updateStreak();

function toggleLearned(id){ STATE.learned[id] = !STATE.learned[id]; saveState(); }
function toggleFavorite(id){ STATE.favorites[id] = !STATE.favorites[id]; saveState(); }
function isLearned(id){ return !!STATE.learned[id]; }
function isFavorite(id){ return !!STATE.favorites[id]; }
function catLearnedCount(catId){ return WORDS[catId].filter(w => isLearned(w.id)).length; }
function totalLearnedCount(){ return allWords().filter(w => isLearned(w.id)).length; }

/* ══════════════════════════ SESLENDİRME / SPEECH ══════════════════════════ */
let _voicesReadyPromise = null;
function waitForVoices(){
  if (_voicesReadyPromise) return _voicesReadyPromise;
  _voicesReadyPromise = new Promise((resolve) => {
    if (!('speechSynthesis' in window)) { resolve([]); return; }
    const existing = window.speechSynthesis.getVoices();
    if (existing.length) { resolve(existing); return; }
    let done = false;
    const finish = () => { if (done) return; done = true; resolve(window.speechSynthesis.getVoices()); };
    window.speechSynthesis.onvoiceschanged = finish;
    setTimeout(finish, 700);
  });
  return _voicesReadyPromise;
}
async function speak(text){
  if (!('speechSynthesis' in window)) { showToast('🔇 Bu cihaz/tarayıcı sesli okumayı desteklemiyor.'); return; }
  try {
    const voices = await waitForVoices();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    const egVoice = voices.find(v => v.lang && v.lang.toLowerCase() === 'ar-eg');
    const anyArVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
    const chosen = egVoice || anyArVoice;
    if (chosen) { u.voice = chosen; u.lang = chosen.lang; } else { u.lang = 'ar'; }
    if (!chosen && !voices.length) { showToast('🔇 Ses motoru yüklenemedi. İnternete bağlıyken bir kez açman yeterli.'); return; }
    if (!chosen) { showToast('ℹ️ Cihazında özel Mısır Arapçası sesi yok — genel Arapça sesle okunuyor.'); }
    window.speechSynthesis.speak(u);
  } catch(e) { showToast('🔇 Ses çalınamadı.'); }
}
function esc(s){ return String(s).replace(/'/g, "\\'").replace(/"/g,'&quot;'); }

let _toastTimer = null;
function showToast(msg){
  let el = document.getElementById('app-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'app-toast';
    el.style.cssText = 'position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--sab) + 30px); transform:translateX(-50%) translateY(20px); background:rgba(15,23,38,0.94); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:12px 18px; border-radius:99px; font-size:13px; font-weight:700; box-shadow:var(--shadow-pop); z-index:200; max-width:88vw; text-align:center; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; });
  _toastTimer = setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(20px)'; }, 3200);
}

const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let _recognizer = null, _listening = false;
function micSupported(){ return !!SpeechRecognitionAPI; }
function toggleVoiceSearch(){
  if (!micSupported()) { showToast('🎙️ Bu tarayıcı sesli aramayı desteklemiyor.'); return; }
  if (_listening) { stopVoiceSearch(); return; }
  try {
    _recognizer = new SpeechRecognitionAPI();
    _recognizer.lang = 'tr-TR';
    _recognizer.interimResults = true;
    _recognizer.maxAlternatives = 1;
    const btn = document.getElementById('mic-btn');
    _recognizer.onstart = () => { _listening = true; if (btn) btn.classList.add('listening'); showToast('🎙️ Dinliyorum... konuş'); };
    _recognizer.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join(' ');
      const input = document.getElementById('search-input');
      if (input) { input.value = transcript; onSearch(transcript); }
    };
    _recognizer.onerror = () => { showToast('🎙️ Sesli arama başarısız — internet bağlantını kontrol et.'); stopVoiceSearch(); };
    _recognizer.onend = () => stopVoiceSearch();
    _recognizer.start();
  } catch(e) { showToast('🎙️ Sesli arama başlatılamadı.'); }
}
function stopVoiceSearch(){
  _listening = false;
  const btn = document.getElementById('mic-btn');
  if (btn) btn.classList.remove('listening');
  try { if (_recognizer) _recognizer.stop(); } catch(e) {}
}

/* ══════════════════════════ ARAMA / AUTOCOMPLETE ══════════════════════════ */
let _searchDebounce = null;
function onSearch(q){
  clearTimeout(_searchDebounce);
  document.getElementById('search-clear').classList.toggle('show', !!q);
  _searchDebounce = setTimeout(() => runSearch(q), 90);
}
// ═══ DÜZELTİLDİ ═══ Önceki sürüm SADECE tam ifadeyi (örn. "merhaba neredesin") bir bütün olarak
// arıyordu — bu tam cümle hiçbir kelimenin alanında geçmediği için hep "sonuç yok" veriyordu.
// Uygulama bir cümle çevirmeni değil, hazır kelime/cümle rehberi olduğundan, artık önce TAM İFADE
// aranıyor; sonuç yoksa cümle TEK TEK KELİMELERE bölünüp her kelime ayrı ayrı aranıyor ve
// eşleşenler birleştiriliyor — böylece "merhaba neredesin" yazınca en azından "merhaba" ve
// "nerede" gibi bilinen kelimeler bulunuyor, boş ekranla karşılaşmıyorsun. /
// ═══ FIXED ═══ The previous version ONLY searched for the FULL phrase (e.g. "merhaba neredesin")
// as one block — since that exact sentence never appears in any word's fields, it always returned
// "no results". Since this is a ready-made phrasebook, not a sentence translator, it now searches
// the FULL PHRASE first; if nothing is found, it SPLITS the sentence into INDIVIDUAL WORDS and
// searches each one separately, merging the matches — so typing "merhaba neredesin" now at least
// finds known words like "merhaba" and "nerede" instead of a blank result.
function runSearch(q){
  const box = document.getElementById('search-results');
  const hintBox = document.getElementById('search-hints');
  q = (q || '').trim().toLowerCase();
  if (!q) { box.innerHTML = ''; renderSearchHints(); return; }
  hintBox.innerHTML = '';
  const words = allWords();

  function scoreAgainst(query){
    const out = [];
    words.forEach(w => {
      const fields = [w.tr.toLowerCase(), w.en.toLowerCase(), w.lat.toLowerCase(), w.ar];
      let best = -1;
      fields.forEach(f => {
        const idx = f.indexOf(query);
        if (idx === -1) return;
        const score = (idx === 0 ? 100 : 50) - Math.min(f.length, 40);
        if (score > best) best = score;
      });
      if (best > -1) out.push({ w, score: best });
    });
    return out;
  }

  let scored = scoreAgainst(q);
  let partial = false;

  if (!scored.length) {
    const tokens = q.split(/\s+/).filter(t => t.length >= 2);
    if (tokens.length > 1) {
      const byId = new Map();
      tokens.forEach(tok => {
        scoreAgainst(tok).forEach(({ w, score }) => {
          const prev = byId.get(w.id);
          if (!prev || score > prev.score) byId.set(w.id, { w, score });
        });
      });
      scored = Array.from(byId.values());
      partial = scored.length > 0;
    }
  }

  scored.sort((a,b) => b.score - a.score);
  const hits = scored.slice(0, 12).map(s => s.w);
  if (!hits.length) { box.innerHTML = `<div class="search-empty">"${q}" için sonuç bulunamadı. Farklı bir kelime dene ya da Okuma Rehberi'ne göz at.</div>`; return; }
  box.innerHTML = (partial ? `<div class="search-empty" style="padding:4px 4px 10px; text-align:left;">Tam cümle bulunamadı — içindeki bilinen kelimeler:</div>` : '') + hits.map((w, i) => `
    <div class="search-hit ${i === 0 ? 'top-hit' : ''}" onclick="openCategory('${w.cat}')">
      <span class="ar">${w.ar}</span>
      <div class="meta"><div class="tr">${w.tr}</div><span class="lat-pill">${w.lat}</span></div>
      <button class="hit-play" onclick="event.stopPropagation(); speak('${esc(w.ar)}')">🔊</button>
    </div>
  `).join('');
  rememberSearch(q);
  // ═══ YENİ ═══ En iyi eşleşme bulunduğunda okunuşu otomatik seslendirilir — kullanıcı ayrıca
  // 🔊 butonuna basmak zorunda kalmaz. Her tuş vuruşunda değil, yazma durakladığında ve sonuç
  // değiştiğinde bir kez seslendirilir. /
  // ═══ NEW ═══ Once a best match is found, its pronunciation is spoken automatically — the user
  // no longer has to tap the 🔊 button. It only speaks once typing pauses and the top result
  // actually changes, not on every keystroke.
  scheduleAutoSpeak(hits[0]);
}
let _autoSpeakTimer = null, _lastAutoSpokenId = null;
function scheduleAutoSpeak(word){
  clearTimeout(_autoSpeakTimer);
  if (!word || word.id === _lastAutoSpokenId) return;
  _autoSpeakTimer = setTimeout(() => { _lastAutoSpokenId = word.id; speak(word.ar); }, 550);
}
function clearSearch(){
  const input = document.getElementById('search-input');
  if (input) { input.value=''; input.focus(); }
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('search-clear').classList.remove('show');
  _lastAutoSpokenId = null;
  clearTimeout(_autoSpeakTimer);
  renderSearchHints();
}
function rememberSearch(q){
  STATE.recentSearches = [q, ...(STATE.recentSearches || []).filter(x => x !== q)].slice(0, 6);
  saveState();
}
function renderSearchHints(){
  const hintBox = document.getElementById('search-hints');
  if (!hintBox) return;
  const suggestions = (STATE.recentSearches && STATE.recentSearches.length) ? STATE.recentSearches : ['teşekkürler','su','nerede','ne kadar','seviyorum'];
  hintBox.innerHTML = suggestions.map(s => `<button class="hint-chip" onclick="document.getElementById('search-input').value='${esc(s)}'; runSearch('${esc(s)}');">${s}</button>`).join('');
}

/* ══════════════════════════ ALIŞTIRMA / PRACTICE ══════════════════════════ */
let _practiceDeck = [], _practiceIdx = 0, _practiceKnown = 0;
function startPractice(catId){
  let pool = catId ? WORDS[catId].slice() : allWords().slice();
  const notLearned = pool.filter(w => !isLearned(w.id));
  const source = notLearned.length >= 6 ? notLearned : pool;
  _practiceDeck = shuffle(source).slice(0, 15);
  _practiceIdx = 0; _practiceKnown = 0;
  if (!_practiceDeck.length) {
    document.getElementById('view-practice').innerHTML = `<div class="empty-state"><div class="glyph">🔄</div>Bu kategoride kelime yok.</div>`;
    showView('practice'); return;
  }
  renderPracticeCard();
  showView('practice');
}
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderPracticeCard(){
  if (_practiceIdx >= _practiceDeck.length) { renderPracticeSummary(); return; }
  const w = _practiceDeck[_practiceIdx];
  const c = catOf(w.cat);
  const dots = _practiceDeck.map((_,i) => `<span class="dot ${i < _practiceIdx ? 'done' : (i === _practiceIdx ? 'now' : '')}"></span>`).join('');
  document.getElementById('view-practice').innerHTML = `
    <div class="practice-wrap">
      <div class="dots">${dots}</div>
      <div class="flash-stage">
        <div class="flash glass" id="flash-el" style="background:linear-gradient(160deg, rgba(${hexToRgb(c.c1)},0.14), transparent 60%);">
          <span class="flash-cat-tag">${c.tr}</span>
          <span class="flash-swipe-badge left" id="badge-left">Tekrar</span>
          <span class="flash-swipe-badge right" id="badge-right">Biliyorum</span>
          <div class="flash-face-a" onclick="flipCard()">
            <div class="ar">${w.ar}</div>
            <div class="flash-hint">👆 Anlamı görmek için dokun</div>
          </div>
          <div class="flash-face-b">
            <div class="tr">${w.tr}</div>
            <span class="lat-pill">${w.lat}</span>
            <div class="en">${w.en}</div>
            <button class="btn btn-glass" onclick="event.stopPropagation(); speak('${esc(w.ar)}')">🔊 Dinle</button>
          </div>
        </div>
      </div>
      <div class="practice-actions">
        <button class="btn btn-glass btn-lg" onclick="practiceAnswer(false)">🔁 Tekrar Et</button>
        <button class="btn btn-teal btn-lg" onclick="practiceAnswer(true)">✅ Biliyorum</button>
      </div>
      <div class="swipe-tip">👉 Sağa kaydır: biliyorum · 👈 sola kaydır: tekrar et</div>
    </div>
  `;
  attachSwipeHandlers();
}
function hexToRgb(hex){ const n = parseInt(hex.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255].join(','); }
function flipCard(){ const el = document.getElementById('flash-el'); if (el) el.classList.toggle('flipped'); }
function attachSwipeHandlers(){
  const el = document.getElementById('flash-el');
  if (!el) return;
  let startX = 0, startY = 0, dx = 0, dragging = false, movedEnough = false;
  const badgeL = document.getElementById('badge-left'), badgeR = document.getElementById('badge-right');
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; movedEnough = false;
    el.style.transition = 'none';
  }, { passive:true });
  el.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0]; dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) < 8 && !movedEnough) return;
    if (Math.abs(dy) > Math.abs(dx) * 1.3 && !movedEnough) return;
    movedEnough = true;
    el.style.transform = `translateX(${dx}px) rotate(${dx/22}deg)`;
    const p = Math.min(1, Math.abs(dx)/90);
    if (dx > 0) { badgeR.style.opacity = p; badgeR.style.transform = `scale(${0.8+0.2*p})`; badgeL.style.opacity = 0; }
    else if (dx < 0) { badgeL.style.opacity = p; badgeL.style.transform = `scale(${0.8+0.2*p})`; badgeR.style.opacity = 0; }
  }, { passive:true });
  el.addEventListener('touchend', () => {
    dragging = false;
    el.style.transition = 'transform .25s ease';
    if (movedEnough && Math.abs(dx) > 90) {
      const knew = dx > 0;
      el.style.transform = `translateX(${knew ? 500 : -500}px) rotate(${knew ? 25 : -25}deg)`;
      setTimeout(() => practiceAnswer(knew), 180);
    } else {
      el.style.transform = 'translateX(0) rotate(0)';
      badgeL.style.opacity = 0; badgeR.style.opacity = 0;
    }
  });
}
function practiceAnswer(knew){
  const w = _practiceDeck[_practiceIdx];
  if (knew) { STATE.learned[w.id] = true; _practiceKnown++; saveState(); }
  _practiceIdx++;
  renderPracticeCard();
}
function renderPracticeSummary(){
  document.getElementById('view-practice').innerHTML = `
    <div class="practice-summary">
      <div class="big">🎉</div>
      <h2 style="font-size:21px; margin-bottom:8px;">Alıştırma Tamamlandı!</h2>
      <p style="color:var(--ink-faint); margin-bottom:20px;">${_practiceDeck.length} kelimeden ${_practiceKnown} tanesini biliyordun.</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary btn-lg" onclick="startPractice()">🔄 Yeniden Başla</button>
        <button class="btn btn-glass btn-lg" onclick="goHome()">🏠 Ana Sayfa</button>
      </div>
    </div>
  `;
}

/* ══════════════════════════ SINAV / QUIZ ══════════════════════════ */
let _quizDeck = [], _quizIdx = 0, _quizScore = 0, _quizLocked = false;
function startQuiz(){
  _quizDeck = shuffle(allWords()).slice(0, 10);
  _quizIdx = 0; _quizScore = 0;
  renderQuizQuestion();
  showView('quiz');
}
function renderQuizQuestion(){
  if (_quizIdx >= _quizDeck.length) { renderQuizResult(); return; }
  _quizLocked = false;
  const w = _quizDeck[_quizIdx];
  const distractors = shuffle(allWords().filter(x => x.id !== w.id)).slice(0,3);
  const options = shuffle([w, ...distractors]);
  document.getElementById('view-quiz').innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-progress">Soru ${_quizIdx + 1} / ${_quizDeck.length} · Skor: ${_quizScore}</div>
      <div class="quiz-q glass"><div class="ar">${w.ar}</div><span class="lat-pill">${w.lat}</span></div>
      <div class="quiz-opts" id="quiz-opts">
        ${options.map(o => `<button class="quiz-opt" data-id="${o.id}" onclick="answerQuiz('${o.id}','${w.id}')">${o.tr}</button>`).join('')}
      </div>
    </div>
  `;
}
function answerQuiz(chosenId, correctId){
  if (_quizLocked) return;
  _quizLocked = true;
  if (chosenId === correctId) _quizScore++;
  document.querySelectorAll('#quiz-opts .quiz-opt').forEach(btn => {
    if (btn.getAttribute('data-id') === correctId) btn.classList.add('correct');
    else if (btn.getAttribute('data-id') === chosenId) btn.classList.add('wrong');
  });
  setTimeout(() => { _quizIdx++; renderQuizQuestion(); }, 700);
}
function renderQuizResult(){
  const pct = Math.round((_quizScore / _quizDeck.length) * 100);
  const stars = pct >= 90 ? '★★★' : pct >= 60 ? '★★☆' : pct >= 30 ? '★☆☆' : '☆☆☆';
  if (_quizScore > (STATE.bestQuiz || 0)) { STATE.bestQuiz = _quizScore; saveState(); }
  document.getElementById('view-quiz').innerHTML = `
    <div class="quiz-wrap quiz-result">
      <div class="hero-eyebrow" style="position:static;">SINAV SONUCU</div>
      <div class="score">${_quizScore}/${_quizDeck.length}</div>
      <div class="stars">${stars}</div>
      <p style="color:var(--ink-dim); margin-bottom:8px;">%${pct} doğru cevap</p>
      <p style="color:var(--ink-faint); font-size:12px; margin-bottom:20px;">En iyi skorun: ${STATE.bestQuiz || 0}/10</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary btn-lg" onclick="startQuiz()">🔄 Tekrar Dene</button>
        <button class="btn btn-glass btn-lg" onclick="goHome()">🏠 Ana Sayfa</button>
      </div>
    </div>
  `;
}

/* ══════════════════════════ ÇEVRİMDIŞI DURUMU ══════════════════════════ */
function updateOnlineStatus(){ document.getElementById('offline-pill').classList.toggle('show', !navigator.onLine); }
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ══════════════════════════ BAŞLAT ══════════════════════════ */
function refreshStreakUI(){
  document.getElementById('streak-txt').textContent = STATE.streak || 0;
  const side = document.getElementById('side-streak-txt');
  if (side) side.textContent = (STATE.streak || 0) + ' günlük seri';
}
function refreshFooterStats(){
  const el = document.getElementById('footer-meta-stats');
  if (!el) return;
  el.innerHTML = `${allWords().length} kelime & harf · ${CATS.length} kategori (alfabe dahil)<br>Çevrimdışı çalışır · Tüm ilerleme bu cihazda saklanır`;
}
refreshStreakUI();
refreshFooterStats();
updateOnlineStatus();
renderHome();
showView('home');
</script>
