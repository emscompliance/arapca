<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Arapça Öğreniyorum — أتعلم العربية</title>
<style>
  :root{
    --bg0:#F2F2F2; --bg1:#FFFFFF;
    --glass:#FFFFFF; --glass-border:#E3E3E3;
    --ink:#0A0A0A; --ink-dim:#4A4A4A; --ink-faint:#868686;
    --gold:#111111; --gold-text:#111111; --gold-glow:rgba(17,17,17,0.20);
    --red:#E8231F; --teal:#111111;
    --radius-lg:18px; --nav-h:64px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --shadow-card:0 2px 8px rgba(15,22,38,0.07), 0 1px 2px rgba(15,22,38,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg0); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; padding-top:var(--sat); position:relative; min-height:100%;
  }
  h1,h2,h3{font-weight:700;}
  .ar{direction:rtl; unicode-bidi:isolate; font-size:22px;}
  .lat-pill{
    direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:5px;
    font-weight:700; font-size:13.5px; color:var(--gold-text); background:rgba(17,17,17,0.07); border:1px solid rgba(17,17,17,0.14);
    padding:4px 10px; border-radius:7px;
  }
  button{font-family:inherit; cursor:pointer; color:inherit;}
  .glass{background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);}
  #app{max-width:1180px; margin:0 auto; min-height:100%; display:flex; position:relative; z-index:1;}
  #sidebar{display:none;}
  #main-col{flex:1; min-width:0; padding-bottom:calc(var(--nav-h) + var(--sab) + 28px);}
  .topbar{padding:16px; background:var(--bg1); border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:center;}
  .home-btn{width:40px; height:40px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; font-weight:bold;}
  .section{padding:14px 16px 4px;}
  .section-title{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; display:flex; align-items:center; gap:8px;}
  .section-title .rule{flex:1; height:1px; background:var(--glass-border);}
  .translator-card{padding:20px 18px;}
  .search-wrap input{
    width:100%; border:1.5px solid var(--glass-border); border-radius:16px; padding:14px 16px;
    font-size:15px; background:#F5F5F5; color:var(--ink); font-weight:600; outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .search-results{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .search-hit{background:#FAFAFA; border:1px solid var(--glass-border); border-radius:14px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .hero-card{padding:22px; border-top:3px solid var(--gold); margin-bottom:10px;}
  .btn{border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:700; background:var(--gold); color:#fff; margin-top:12px;}
  .cat-list{display:flex; flex-direction:column; background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); overflow:hidden;}
  .cat-row{display:flex; align-items:center; gap:13px; padding:14px 16px; text-align:left; border:none; background:none; border-bottom:1px solid var(--glass-border); width:100%;}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .mark{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--bg0); font-weight:bold;}
  .cat-row .info{flex:1;}
  .cat-row .name{font-weight:700; font-size:14px;}
  .cat-row .en{font-size:11px; color:var(--ink-faint);}
  .word-list{display:flex; flex-direction:column; gap:10px; padding:0 16px 20px;}
  .word-card{padding:16px; display:flex; flex-direction:column; gap:8px;}
  .back-row{padding:16px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;}
  .back-btn{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass); border:1px solid var(--glass-border);}
  #bottom-nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--sab)); padding-bottom:var(--sab); background:#FFFFFF; border-top:1px solid var(--glass-border); display:flex; z-index:50;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:10px; font-weight:600;}
  .nav-btn.active{color:var(--gold);}
  .empty-state{padding:30px; text-align:center; color:var(--ink-faint);}
</style>
</head>

<div id="app">

let favorites = JSON.parse(localStorage.getItem('masrawy_favs') || '[]');

function goHome() {
  document.getElementById('view-home').style.display = 'block';
  document.getElementById('view-category').style.display = 'none';
  document.getElementById('view-favorites').style.display = 'none';
  renderHome();
}

function renderHome() {
  const html = `
    <div class="section">
      <div class="hero-card glass">
        <div style="font-size:11px; font-weight:800; color:var(--red); margin-bottom:8px; text-transform:uppercase;">Günün Mısır Sözü</div>
        <div class="ar" style="font-size:28px; margin-bottom:8px;">ازيك يا باشا؟</div>
        <div style="font-weight:800; font-size:16px;">Nasılsın başganım?</div>
        <button class="btn" onclick="openCategory('greetings')">Hemen İncele →</button>
      </div>
    </div>

    <div class="section">
      <div class="translator-card glass">
        <div style="font-weight:800; font-size:15px; margin-bottom:10px;">Kelime Ara</div>
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Aramak için kelime yazın..." oninput="handleSearch(this.value)">
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span>Kategoriler</span><div class="rule"></div></div>
      <div class="cat-list">
        ${CATS.map(c => `
          <button class="cat-row" onclick="openCategory('${c.id}')">
            <div class="mark">${c.mark}</div>
            <div class="info">
              <div class="name">${c.tr}</div>
              <div class="en">${c.en}</div>
            </div>
            <div style="font-size:11px; color:var(--ink-faint); font-weight:700;">${WORDS.filter(w=>w.cat===c.id).length} öğe</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('view-home').innerHTML = html;
}

function handleSearch(query) {
  const box = document.getElementById('searchResults');
  if(!query.trim()) { box.innerHTML = ''; return; }
  const q = query.toLowerCase();
  const res = WORDS.filter(w => w.tr.toLowerCase().includes(q) || w.lat.toLowerCase().includes(q) || w.ar.includes(q));
  
  if(!res.length) {
    box.innerHTML = `<div style="padding:10px; text-align:center; color:var(--ink-faint);">Sonuç bulunamadı.</div>`;
    return;
  }
  box.innerHTML = res.slice(0, 8).map(w => `
    <div class="search-hit" onclick="speakText('${w.ar}')">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="ar" style="font-size:18px;">${w.ar}</span>
        <span class="lat-pill">${w.lat}</span>
      </div>
      <span style="font-weight:700; font-size:13px;">${w.tr}</span>
    </div>
  `).join('');
}

function speakText(txt) {
  if('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(txt);
    utterance.lang = 'ar-EG';
    window.speechSynthesis.speak(utterance);
  }
}

function openCategory(catId) {
  const cat = CATS.find(c => c.id === catId);
  const items = WORDS.filter(w => w.cat === catId);
  
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-category').style.display = 'block';
  document.getElementById('view-favorites').style.display = 'none';
  
  document.getElementById('view-category').innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="goHome()">←</button>
      <span>${cat ? cat.tr : ''}</span>
    </div>
    <div class="word-list">
      ${items.length ? items.map(w => {
        const isFav = favorites.includes(w.id);
        return `
          <div class="word-card glass">
            <div class="ar">${w.ar}</div>
            <div><span class="lat-pill">${w.lat}</span></div>
            <div style="font-weight:800; font-size:15px; margin-top:4px;">${w.tr}</div>
            <div style="font-size:12px; color:var(--ink-faint);">${w.en}</div>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="btn" style="padding:6px 12px; margin:0;" onclick="speakText('${w.ar}')">🔊 Seslet</button>
              <button class="btn" style="padding:6px 12px; margin:0; background:${isFav?'#333':'#888'}" onclick="toggleFav(${w.id}, '${catId}')">⭐ ${isFav?'Favorilerde':'Favoriye Ekle'}</button>
            </div>
          </div>
        `;
      }).join('') : '<div class="empty-state">Bu kategoride henüz kelime bulunmuyor.</div>'}
    </div>
  `;
}

function showAllCategories() { goHome(); }

function showFavorites() {
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-category').style.display = 'none';
  document.getElementById('view-favorites').style.display = 'block';

  const favItems = WORDS.filter(w => favorites.includes(w.id));
  document.getElementById('view-favorites').innerHTML = `
    <div class="back-row">⭐ Favori Kelimelerim</div>
    <div class="word-list">
      ${favItems.length ? favItems.map(w => `
        <div class="word-card glass">
          <div class="ar">${w.ar}</div>
          <div><span class="lat-pill">${w.lat}</span></div>
          <div style="font-weight:800; font-size:15px; margin-top:4px;">${w.tr}</div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn" style="padding:6px 12px; margin:0;" onclick="speakText('${w.ar}')">🔊 Seslet</button>
            <button class="btn" style="padding:6px 12px; margin:0; background:#333" onclick="toggleFav(${w.id}, 'fav')">🗑️ Kaldır</button>
          </div>
        </div>
      `).join('') : '<div class="empty-state">Henüz favorilere kelime eklemediniz.</div>'}
    </div>
  `;
}

function toggleFav(id, contextCat) {
  if(favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('masrawy_favs', JSON.stringify(favorites));
  
  if(contextCat === 'fav') {
    showFavorites();
  } else {
    openCategory(contextCat);
  }
}

goHome();
</script>
</body>
</html>
