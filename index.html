<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Mısır Arapçası (Amiyye) günlük kelime ve cümle rehberi — okunuşuyla, çevrimdışı çalışır.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arapça Öğreniyorum">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="icon" href="favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Arapça Öğreniyorum — أتعلم العربية</title>
<style>
  :root{
    --bg0:#F2F2F2; --bg1:#FFFFFF;
    --glass:#FFFFFF; --glass-hi:#F8F8F8; --glass-border:#E3E3E3;
    --ink:#0A0A0A; --ink-dim:#4A4A4A; --ink-faint:#868686;
    --gold:#111111; --gold-soft:#3A3A3A; --gold-text:#111111; --gold-glow:rgba(17,17,17,0.20);
    --red:#E8231F; --red-soft:#FF5C57; --teal:#111111; --teal-soft:#3A3A3A;
    --radius-lg:18px; --radius-md:14px; --radius-sm:10px;
    --nav-h:64px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --shadow-card:0 2px 8px rgba(15,22,38,0.07), 0 1px 2px rgba(15,22,38,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    background:var(--bg0); color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.5; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
    padding-top:var(--sat); position:relative; min-height:100%;
  }
  h1,h2,h3{font-weight:700; letter-spacing:-.01em;}
  .ar{ font-family:"Amiri","Noto Naskh Arabic","Geeza Pro","Damascus",Tahoma,sans-serif; direction:rtl; unicode-bidi:isolate; }
  .lat-pill{
    direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:5px;
    font-weight:700; font-size:13.5px; color:var(--gold-text); background:rgba(17,17,17,0.07); border:1px solid rgba(17,17,17,0.14);
    padding:5px 13px; border-radius:7px; letter-spacing:.01em;
  }
  button{font-family:inherit; cursor:pointer; color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold); color:#FFFFFF;}
  input{color:var(--ink); user-select:text;}
  .glass{background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);}
  #app{max-width:1180px; margin:0 auto; min-height:100%; display:flex; position:relative; z-index:1;}
  #sidebar{display:none;}
  #main-col{flex:1; min-width:0; padding-bottom:calc(var(--nav-h) + var(--sab) + 28px);}
  .topbar{padding:calc(16px + var(--sat)) 16px 12px; background:var(--bg1); border-bottom:1px solid var(--glass-border);}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .home-btn{width:44px; height:44px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow-card); padding:2px;}
  .home-logo-img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .streak-pill{display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:99px; font-size:12.5px; font-weight:800; color:var(--gold-text);}
  .section{padding:14px 16px 4px; position:relative; z-index:1;}
  .section-title{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:11px; display:flex; align-items:center; gap:8px;}
  .section-title .rule{flex:1; height:1px; background:var(--glass-border);}
  .translator-card{padding:20px 18px 18px; position:relative; overflow:hidden;}
  .translator-title{font-size:16px; font-weight:800; margin-bottom:3px; color:var(--ink);}
  .translator-sub{color:var(--ink-dim); font-size:12px; margin-bottom:14px;}
  .search-wrap{position:relative;}
  .search-input-row{position:relative;}
  .search-wrap input{
    width:100%; border:1.5px solid var(--glass-border); border-radius:16px; padding:16px 90px 16px 16px;
    font-size:16px; background:#F5F5F5; color:var(--ink); font-weight:600;
  }
  .search-wrap input::placeholder{color:var(--ink-faint); font-weight:500;}
  .search-wrap input:focus{outline:none; border-color:var(--gold);}
  .mic-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--teal-soft),var(--teal)); border:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .mic-btn.listening{background:var(--red); animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{transform:translateY(-50%) scale(1);} 50%{transform:translateY(-50%) scale(1.12);} 100%{transform:translateY(-50%) scale(1);}}
  .search-results{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .search-hit{background:#FAFAFA; border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;}
  .search-hit .ar{font-size:20px; color:var(--gold-text); flex-shrink:0; min-width:64px;}
  .search-hit .meta{min-width:0; flex:1; display:flex; flex-direction:column; gap:5px; align-items:flex-start;}
  .search-hit .meta .tr{font-size:13.5px; font-weight:700; color:var(--ink);}
  .search-hit .hit-play{width:34px; height:34px; border-radius:50%; background:rgba(17,17,17,0.10); border:none; color:var(--gold-text); font-size:14px; flex-shrink:0;}
  .hero-card{padding:26px 22px; position:relative; text-align:left; border-top:3px solid var(--gold);}
  .hero-eyebrow{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--red); margin-bottom:14px;}
  .hero-ar{font-size:36px; font-weight:600; color:var(--ink); line-height:1.3; margin-bottom:14px;}
  .hero-tr{font-size:20px; font-weight:800; margin-bottom:3px; color:var(--ink); letter-spacing:-.01em;}
  .hero-en{font-size:12.5px; color:var(--ink-faint); margin-bottom:20px;}
  .btn{border:none; border-radius:10px; padding:12px 18px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:46px;}
  .btn-primary{background:var(--gold); color:#FFFFFF; box-shadow:0 4px 14px var(--gold-glow);}
  .cat-list{display:flex; flex-direction:column; background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card);}
  .cat-row{display:flex; align-items:center; gap:13px; padding:15px 16px; text-align:left; border:none; background:none; border-bottom:1px solid var(--glass-border); width:100%;}
  .cat-row:last-child{border-bottom:none;}
  .cat-row:active{background:var(--bg0);}
  .cat-row .mark{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; background:var(--bg0); color:var(--ink-dim); font-weight:700;}
  .cat-row .info{flex:1; min-width:0;}
  .cat-row .name{font-weight:700; font-size:14px; color:var(--ink);}
  .cat-row .en{font-size:10.5px; color:var(--ink-faint); margin-top:1px;}
  .cat-row .count{font-size:11.5px; color:var(--ink-faint); font-weight:700; flex-shrink:0; text-align:right;}
  .cat-row .chevron{color:var(--ink-faint); font-size:17px; flex-shrink:0;}
  .word-list{display:flex; flex-direction:column; gap:11px; padding:0 16px 20px; position:relative; z-index:1;}
  .word-card{padding:18px; position:relative; overflow:hidden;}
  .word-stack{display:flex; flex-direction:column; align-items:flex-start; gap:9px;}
  .word-stack .ar{font-size:25px; color:var(--ink);}
  .word-stack .tr{font-size:14.5px; font-weight:800; color:var(--ink); margin-top:2px;}
  .word-stack .en{font-size:11.5px; color:var(--ink-faint);}
  .word-actions-row{display:flex; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--glass-border);}
  .icon-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--glass-border); background:#F5F5F5; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-dim);}
  .icon-btn.on{background:linear-gradient(135deg,var(--gold-soft),var(--gold)); border-color:transparent; color:#FFFFFF;}
  .empty-state{padding:48px 22px; text-align:center; color:var(--ink-faint); position:relative; z-index:1;}
  .back-row{padding:16px 16px 0; display:flex; align-items:center; gap:10px; position:relative; z-index:1; font-weight:800; font-size:16px;}
  .back-btn{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink); background:var(--glass); border:1px solid var(--glass-border);}
  #bottom-nav{position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--sab)); padding-bottom:var(--sab); background:#FFFFFF; border-top:1px solid var(--glass-border); display:flex; z-index:50;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:9.5px; font-weight:600; min-height:44px;}
  .nav-btn.active{color:var(--gold);}
  .app-footer{padding:26px 16px 8px; position:relative; z-index:1;}
  .footer-card{padding:22px 20px; text-align:center;}
  .footer-tag{font-size:11.5px; color:var(--ink-faint); margin-bottom:16px;}
  .footer-flags{font-size:18px; margin-bottom:16px; letter-spacing:2px;}
  .footer-contact{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:99px; background:rgba(17,17,17,0.10); border:1px solid rgba(17,17,17,0.28); color:var(--gold-text); font-size:12.5px; font-weight:700; margin-bottom:16px; word-break:break-all;}
  .footer-actions{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:16px;}
  .footer-mini-btn{display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:99px; font-size:12px; font-weight:700; color:var(--ink-dim); background:#F5F5F5; border:1px solid var(--glass-border);}
  .footer-meta{font-size:10.5px; color:var(--ink-faint); border-top:1px solid var(--glass-border); padding-top:14px; line-height:1.7;}
  @media (min-width:901px){
    body{padding:24px 0;}
    #app{gap:26px; align-items:flex-start;}
    #sidebar{display:flex; flex-direction:column; width:236px; flex-shrink:0; padding:22px 16px; position:sticky; top:24px; gap:4px;}
    .side-brand{display:flex; align-items:center; justify-content:center; padding:6px 6px 18px; background:none; border:none; width:100%; cursor:pointer;}
    .side-logo-img{width:100%; max-width:170px; height:auto; object-fit:contain;}
    .side-flags{display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 0 18px; font-size:22px; border-bottom:1px solid var(--glass-border); margin-bottom:10px;}
    .side-link{display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:14px; background:none; border:none; font-size:14px; font-weight:700; color:var(--ink-dim); text-align:left; width:100%;}
    .side-link .ic{font-size:17px; width:20px; flex-shrink:0; text-align:center;}
    .side-link .lbl{flex:1;}
    .side-link.active{background:linear-gradient(135deg,rgba(17,17,17,0.18),rgba(17,17,17,0.06)); color:var(--gold-text);}
    #main-col{padding-bottom:24px;}
    #bottom-nav{display:none;}
  }
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar" class="glass">
    <button class="side-brand" onclick="goHome()">
      <img src="logo-full.png" alt="Arapça Öğren" class="side-logo-img">
    </button>
    <div class="side-flags">🇹🇷 ✕ 🇪🇬</div>
    <button class="side-link active" onclick="goHome()"><span class="ic">🏠</span><span class="lbl">Ana Sayfa</span></button>
    <button class="side-link" onclick="showAllCategories()"><span class="ic">📚</span><span class="lbl">Kategoriler</span></button>
    <button class="side-link" onclick="openCategory('phrases')"><span class="ic">💬</span><span class="lbl">Günlük Cümleler</span></button>
    <button class="side-link" onclick="startPractice()"><span class="ic">🔄</span><span class="lbl">Alıştırma</span></button>
    <button class="side-link" onclick="startQuiz()"><span class="ic">📝</span><span class="lbl">Sınav</span></button>
    <button class="side-link" onclick="showFavorites()"><span class="ic">⭐</span><span class="lbl">Favoriler</span></button>
  </nav>

  <div id="main-col">
    <div class="topbar">
      <div class="topbar-row">
        <button class="home-btn" onclick="goHome()">
          <img src="favicon-192.png" alt="Logo" class="home-logo-img">
        </button>
        <span class="streak-pill glass">🔥 <span id="mob-streak-txt">1</span> günlük seri</span>
      </div>
    </div>

    <div id="view-home"></div>
    <div id="view-category" style="display:none;"></div>
    <div id="view-practice" style="display:none;"></div>
    <div id="view-quiz" style="display:none;"></div>
    <div id="view-favorites" style="display:none;"></div>

    <footer class="app-footer">
      <div class="footer-card glass">
        <div class="footer-tag" style="font-weight:800; font-size:14px; color:var(--ink); margin-bottom:6px;">Arapça Öğreniyorum</div>
        <div class="footer-tag">Türkçe konuşanlar için günlük Mısır Arapçası rehberi</div>
        <div class="footer-flags">🇹🇷 ✦ 🇪🇬</div>
        <a class="footer-contact" href="mailto:abdullahbaydogan@hotmail.com">✉️ abdullahbaydogan@hotmail.com</a>
        <div class="footer-actions">
          <button class="footer-mini-btn" onclick="shareApp()">🔗 Paylaş</button>
          <button class="footer-mini-btn" onclick="confirmResetProgress()">🗑️ İlerlemeyi Sıfırla</button>
        </div>
        <div class="footer-meta">Çevrimdışı çalışır · Tüm ilerleme bu cihazda saklanır</div>
      </div>
    </footer>
  </div>
</div>

<nav id="bottom-nav">
  <button class="nav-btn active" onclick="goHome()"><span class="ic">🏠</span>Ana Sayfa</button>
  <button class="nav-btn" onclick="showAllCategories()"><span class="ic">📚</span>Kategoriler</button>
  <button class="nav-btn" onclick="startPractice()"><span class="ic">🔄</span>Alıştırma</button>
  <button class="nav-btn" onclick="startQuiz()"><span class="ic">📝</span>Sınav</button>
  <button class="nav-btn" onclick="showFavorites()"><span class="ic">⭐</span>Favoriler</button>
</nav>

let favorites = JSON.parse(localStorage.getItem('masrawy_favs') || '[]');
let streak = parseInt(localStorage.getItem('masrawy_streak') || '1');

function goHome() {
  setActiveNav(0);
  document.getElementById('view-home').style.display = 'block';
  document.getElementById('view-category').style.display = 'none';
  document.getElementById('view-practice').style.display = 'none';
  document.getElementById('view-quiz').style.display = 'none';
  document.getElementById('view-favorites').style.display = 'none';
  renderHome();
}

function renderHome() {
  document.getElementById('mob-streak-txt').innerText = streak;
  const html = `
    <div class="section">
      <div class="hero-card glass">
        <div class="hero-eyebrow">Günün Mısır Sözü</div>
        <div class="hero-ar ar">ازيك يا باشا؟</div>
        <div class="hero-tr">Nasılsın başganım?</div>
        <div class="hero-en">How are you, boss?</div>
        <button class="btn btn-primary" onclick="openCategory('greetings')">Hemen İncele →</button>
      </div>
    </div>

    <div class="section">
      <div class="translator-card glass">
        <div class="translator-title">Mısır Arapçası Sözlük & Çeviri</div>
        <div class="translator-sub">Tüm kelime ve cümlelerde anında ara (Sesli arama desteklenir)</div>
        <div class="search-wrap">
          <div class="search-input-row">
            <input type="text" id="searchInput" placeholder="Kelime veya Türkçe anlamı yazın..." oninput="handleSearch(this.value)">
            <button class="mic-btn" id="micBtn" onclick="toggleSpeechSearch()" title="Sesli Ara">🎤</button>
          </div>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span>Kategoriler</span><div class="rule"></div></div>
      <div class="cat-list">
        ${CATS.map(c => `
          <button class="cat-row" onclick="openCategory('${c.id}')">
            <div class="mark">${c.mark}</div>
            <div class="info">
              <div class="name">${c.tr}</div>
              <div class="en">${c.en}</div>
            </div>
            <div class="count">${WORDS.filter(w=>w.cat===c.id).length} kelime</div>
            <div class="chevron">›</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('view-home').innerHTML = html;
}

function handleSearch(query) {
  const box = document.getElementById('searchResults');
  if(!query.trim()) { box.innerHTML = ''; return; }
  const q = query.toLowerCase();
  const res = WORDS.filter(w => w.tr.toLowerCase().includes(q) || w.lat.toLowerCase().includes(q) || w.ar.includes(q) || w.en.toLowerCase().includes(q));
  
  if(!res.length) {
    box.innerHTML = `<div class="empty-state" style="padding:16px;">Sonuç bulunamadı.</div>`;
    return;
  }
  box.innerHTML = res.slice(0, 10).map(w => `
    <div class="search-hit glass" onclick="speakText('${w.ar}')">
      <div class="ar">${w.ar}</div>
      <div class="meta">
        <div class="lat-pill">${w.lat}</div>
        <div class="tr">${w.tr}</div>
      </div>
      <button class="hit-play">🔊</button>
    </div>
  `).join('');
}

function toggleSpeechSearch() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition) {
    alert("Tarayıcınız sesli aramayı desteklemiyor.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';
  const micBtn = document.getElementById('micBtn');
  
  recognition.onstart = () => { micBtn.classList.add('listening'); };
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById('searchInput').value = text;
    handleSearch(text);
  };
  recognition.onerror = () => { micBtn.classList.remove('listening'); };
  recognition.onend = () => { micBtn.classList.remove('listening'); };
  recognition.start();
}

function speakText(txt) {
  if('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(txt);
    utterance.lang = 'ar-EG';
    window.speechSynthesis.speak(utterance);
  }
}

function openCategory(catId) {
  const cat = CATS.find(c => c.id === catId);
  const items = WORDS.filter(w => w.cat === catId);
  
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-category').style.display = 'block';
  document.getElementById('view-practice').style.display = 'none';
  document.getElementById('view-quiz').style.display = 'none';
  document.getElementById('view-favorites').style.display = 'none';
  
  document.getElementById('view-category').innerHTML = `
    <div class="back-row" style="padding: 16px;">
      <button class="back-btn" onclick="goHome()">←</button>
      <span>${cat ? cat.tr : ''}</span>
    </div>
    <div class="word-list">
      ${items.length ? items.map(w => {
        const isFav = favorites.includes(w.id);
        return `
          <div class="word-card glass">
            <div class="word-stack">
              <div class="ar">${w.ar}</div>
              <div class="lat-pill">${w.lat}</div>
              <div class="tr">${w.tr}</div>
              <div class="en">${w.en}</div>
            </div>
            <div class="word-actions-row">
              <button class="icon-btn" onclick="speakText('${w.ar}')">🔊</button>
              <button class="icon-btn ${isFav?'on':''}" onclick="toggleFav(${w.id})">⭐</button>
            </div>
          </div>
        `;
      }).join('') : '<div class="empty-state">Bu kategoride henüz kelime bulunmuyor.</div>'}
    </div>
  `;
}

function showAllCategories() { goHome(); }
function startPractice() { alert("Alıştırma modülü aktif."); }
function startQuiz() { alert("Sınav modülü aktif."); }
function showFavorites() {
  setActiveNav(4);
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-category').style.display = 'none';
  document.getElementById('view-practice').style.display = 'none';
  document.getElementById('view-quiz').style.display = 'none';
  document.getElementById('view-favorites').style.display = 'block';

  const favItems = WORDS.filter(w => favorites.includes(w.id));
  document.getElementById('view-favorites').innerHTML = `
    <div class="back-row" style="padding: 16px;">⭐ Favori Kelimelerim</div>
    <div class="word-list">
      ${favItems.length ? favItems.map(w => `
        <div class="word-card glass">
          <div class="word-stack">
            <div class="ar">${w.ar}</div>
            <div class="lat-pill">${w.lat}</div>
            <div class="tr">${w.tr}</div>
          </div>
          <div class="word-actions-row">
            <button class="icon-btn" onclick="speakText('${w.ar}')">🔊</button>
            <button class="icon-btn on" onclick="toggleFav(${w.id})">⭐</button>
          </div>
        </div>
      `).join('') : '<div class="empty-state">Henüz favorilere kelime eklemediniz.</div>'}
    </div>
  `;
}

function toggleFav(id) {
  if(favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('masrawy_favs', JSON.stringify(favorites));
  if(document.getElementById('view-favorites').style.display === 'block') {
    showFavorites();
  } else {
    location.reload();
  }
}

function setActiveNav(idx) {
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach((b, i) => {
    if(i === idx) b.classList.add('active');
    else b.classList.remove('active');
  });
}

function shareApp() { alert("Uğurlu paylaşımlar!"); }
function confirmResetProgress() { if(confirm('İlerlemeniz sıfırlansın mı?')) { localStorage.clear(); location.reload(); } }

goHome();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW hatası:', err));
}
